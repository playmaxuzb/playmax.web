<style>
/* Layout: a bright showroom — cream floor, brand-color stages, navy type; arcade push-buttons as the signature control. Single light look by design. */
:root{
  --ink:#0B2A6F; --ink-2:#3A4C7A; --muted:#5A6A92;
  --cream:#FFF8EE; --paper:#FFFFFF; --line:rgba(11,42,111,.10); --line-2:rgba(11,42,111,.18);
  --blue:#1F5BD8; --blue-d:#1543A8; --sky:#22B0F0; --sky-d:#0E86C0;
  --red:#E8352B; --red-d:#B5221A; --pink:#FF4F8B; --pink-d:#D0336B;
  --gold:#FFC233; --gold-d:#D99A00; --orange:#FF8A1F; --orange-d:#D06608; --green:#1E9E52;
  --tint-sky:#E4F4FE; --tint-pink:#FFE8F0; --tint-gold:#FFF3D6; --tint-orange:#FFEEDD;
  --display:'Unbounded','Vazirmatn',system-ui,sans-serif; --body:'Manrope','Vazirmatn',system-ui,sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 18px 44px -18px rgba(11,42,111,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body{font-family:'Vazirmatn',var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:'Vazirmatn',var(--display);font-weight:800;letter-spacing:0}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Arcade push-buttons */
.btn{--b:var(--red);--bd:var(--red-d);--fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:16px;background:var(--b);color:var(--fg);font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 var(--bd),0 14px 26px -12px var(--b);transform:translateY(0);transition:transform .12s ease,box-shadow .12s ease,filter .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 6px 12px -8px var(--b)}
.btn.blue{--b:var(--blue);--bd:var(--blue-d)}
.btn.sky{--b:var(--sky);--bd:var(--sky-d)}
.btn.gold{--b:var(--gold);--bd:var(--gold-d);--fg:var(--ink)}
.btn.pink{--b:var(--pink);--bd:var(--pink-d)}
.btn.ghost{--b:var(--paper);--bd:rgba(11,42,111,.16);--fg:var(--ink);box-shadow:0 5px 0 var(--bd),0 12px 24px -16px rgba(11,42,111,.4);outline:1.5px solid var(--line-2);outline-offset:-1.5px}
.btn.sm{min-height:42px;padding:0 16px;border-radius:13px;font-size:14px}
.btn.block{width:100%}
.btn svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true],.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--paper);cursor:pointer;position:relative}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:800 11px/20px var(--body);text-align:center}

/* Header */
/* top strip: pure decoration, no text */
.annc{height:10px;background:linear-gradient(90deg,var(--blue) 0 16.66%,var(--sky) 0 33.33%,var(--pink) 0 50%,var(--red) 0 66.66%,var(--orange) 0 83.33%,var(--gold) 0);position:relative;overflow:hidden}
.annc::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:40% 100%;background-repeat:no-repeat;animation:annc 5.5s ease-in-out infinite}
@keyframes annc{0%{background-position:-60% 0}60%,100%{background-position:160% 0}}
/* language switcher: flags + codes only */
.langsw{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font:800 13px var(--body);letter-spacing:.06em;cursor:pointer}
.langbtn svg,.langmenu svg{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(11,42,111,.14);flex:none;display:block}
.langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--paper);border-radius:18px;padding:6px;box-shadow:var(--shadow);display:grid;gap:2px;z-index:70;min-width:120px}
.langmenu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;font:800 14px var(--body);letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.langmenu button:hover{background:var(--cream)}
.langmenu button[aria-current=true]{background:var(--ink);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,248,238,.96)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,248,238,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:74px}
.logo{display:flex;align-items:center;flex:none;cursor:pointer;border:0;background:none;padding:0}
.logo img{height:34px;width:auto}
nav.main{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav.main button{border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
nav.main button:hover{background:rgba(11,42,111,.06)}
nav.main button[aria-current=page]{background:var(--ink);color:#fff}
.top-actions{display:flex;gap:10px;align-items:center;flex:none}
.acct{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-weight:800;font-size:14px;cursor:pointer}
.acct .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;display:grid;place-items:center;font:800 13px var(--display)}
.menu-btn{display:none}
@media (max-width:640px){.langbtn{padding:0 10px}.top-actions{gap:6px}}
@media (max-width:480px){header.top .wrap{gap:8px;min-height:64px}.logo img{height:26px}.top-actions{gap:5px}.top-actions .icon-btn{width:40px;height:40px}.langbtn{padding:0 8px;min-height:40px}.langbtn span{display:none}.acct{min-height:40px;padding:0 4px}.acct .av{width:30px;height:30px}.hcard.whole .glow,.hcard.show::after{max-width:100%}}
.hcard{contain:paint}
@media (max-width:360px){header.top .wrap{gap:4px;padding-inline:10px}.logo img{height:22px}.top-actions{gap:3px}.top-actions .icon-btn{width:36px;height:36px}.langbtn{padding:0 6px;min-height:36px}.acct{min-height:36px;padding:0 2px}}
@media (max-width:1080px){
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);flex-direction:column;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main button{justify-content:flex-start;padding:14px}
  .menu-btn{display:grid}
  .acct span.nm{display:none}
}

/* Hero showroom */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-10% -10% 0;background:radial-gradient(34% 40% at 12% 18%,rgba(34,176,240,.22),transparent 70%),radial-gradient(30% 36% at 90% 10%,rgba(255,79,139,.18),transparent 70%),radial-gradient(40% 30% at 70% 100%,rgba(255,194,51,.34),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;padding-block:48px 36px}
.hero h1{font-size:clamp(36px,5.2vw,68px);font-weight:900;margin-top:18px}
.hero h1 em{font-style:normal;color:var(--red);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.16em;background:var(--gold);border-radius:4px;z-index:-1}
.hero p.lead{margin-top:18px;font-size:18px;color:var(--ink-2);max-width:520px}
.kicker{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;font-size:13px;box-shadow:0 8px 20px -10px rgba(11,42,111,.3)}
.kicker b{background:var(--gold);border-radius:999px;padding:3px 10px;font-size:11px;letter-spacing:.08em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:34px}
.facts div strong{display:block;font:800 26px/1 var(--display)}
.facts div span{font-size:13px;font-weight:700;color:var(--muted)}
.showroom{position:relative;aspect-ratio:1.08/1;width:100%;max-width:100%}
.showroom .wall{position:absolute;inset:4% 2% 26%;border-radius:46% 46% 26px 26px/30% 30% 26px 26px;background:linear-gradient(180deg,#FFFFFF,#FFF3E2);box-shadow:inset 0 0 0 2px rgba(11,42,111,.06)}
.alcove{position:absolute;bottom:26%;border-radius:999px 999px 18px 18px}
.alcove::after{content:"";position:absolute;left:10%;right:10%;top:0;height:70%;background:radial-gradient(50% 60% at 50% 0%,rgba(255,255,255,.95),transparent 70%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#FFFDF8,#FFE9C4);border-radius:0 0 30px 30px;overflow:hidden}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(11,42,111,.05) 0 1px,transparent 1px 60px);transform:perspective(300px) rotateX(55deg);transform-origin:50% 0}
.mach{position:absolute;bottom:14%;cursor:pointer;background:none;border:0;padding:0;-webkit-box-reflect:below 2px linear-gradient(transparent 72%,rgba(255,255,255,.28));transition:transform .35s cubic-bezier(.22,1,.36,1)}
.mach img{height:100%;width:auto;max-width:none;filter:drop-shadow(0 18px 18px rgba(11,42,111,.22))}
.mach:hover{transform:translateY(-8px)}
.pedestal{position:absolute;border-radius:50%}
.tagc{position:absolute;background:var(--paper);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;font-size:13px;cursor:pointer;border:0;text-align:start}
.tagc small{display:block;font-size:11px;color:var(--red);letter-spacing:.06em}
.tagc strong{font:800 18px/1.2 var(--display)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.showroom{max-width:620px;margin:0 auto}}

/* Ticker */
.ticker{background:var(--gold);overflow:hidden;display:flex;border-block:2px solid var(--ink)}
.ticker .trk{display:flex;flex:none;width:max-content;gap:30px;padding:14px 15px;font:800 20px/1 var(--display);animation:tick 18s linear infinite;animation-play-state:running;white-space:nowrap;will-change:transform}
.ticker .trk span:nth-child(even){color:var(--red)}
@keyframes tick{to{transform:translate3d(-50%,0,0)}}
/* ticker always moves, in every language: layout stays LTR so the loop is seamless; RTL text keeps its own direction and scrolls the other way */
.ticker{direction:ltr}
.ticker .trk span{unicode-bidi:isolate}
[dir=rtl] .ticker .trk span{direction:rtl}
[dir=rtl] .ticker .trk{animation-name:tickR}
@keyframes tickR{from{transform:translate3d(-50%,0,0)}to{transform:translate3d(0,0,0)}}

/* Sections */
section.sec{padding-block:72px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(28px,3.6vw,44px);font-weight:900;margin-top:10px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat-tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:270px;border-radius:var(--r-lg);padding:20px;border:0;text-align:start;cursor:pointer;overflow:hidden;background:var(--t);color:var(--ink);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.cat-tile:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.cat-tile h3{font-size:19px;font-weight:800;max-width:70%}
.cat-tile .cnt{font-weight:800;font-size:13px;color:var(--c)}
.cat-tile .img{position:absolute;inset-inline-end:-6%;bottom:8%;height:62%;width:62%;display:flex;align-items:flex-end;justify-content:center}
.cat-tile .img img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(11,42,111,.18));transition:transform .4s cubic-bezier(.22,1,.36,1)}
.cat-tile .img img.rph{border-radius:16px}
.cat-tile:hover .img img{transform:scale(1.07) rotate(-2deg)}
.cat-tile .go{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--c);position:relative;z-index:1}
.cat-tile.big{grid-column:span 2;min-height:300px}
@media (max-width:560px){.cat-tile.big{grid-column:auto}}

/* Product card */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-lg);padding:12px;box-shadow:0 1px 0 var(--line);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s;cursor:pointer;position:relative}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.pcard .stage{position:relative;height:250px;border-radius:20px;background:radial-gradient(70% 60% at 50% 30%,#FFFFFF,var(--t));display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:14px 14px 22px}
.pcard .stage::after{content:"";position:absolute;bottom:14px;left:22%;right:22%;height:16px;border-radius:50%;background:rgba(11,42,111,.14);filter:blur(4px)}
.pcard .stage img{position:relative;z-index:1;max-height:100%;max-width:100%;object-fit:contain;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.rph{border-radius:14px}
.pcard:hover .stage img{transform:scale(1.06)}
.pcard .flags{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;z-index:2}
.flag{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}
.pcard .meta{padding:14px 6px 4px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .model{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--c,var(--red))}
.pcard .name{font:800 17px/1.2 var(--display)}
.pcard .spec{font-size:13px;color:var(--muted);font-weight:600}
.pcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;gap:8px}
.price{font:800 22px/1 var(--display)}
.price small{font:700 11px var(--body);color:var(--muted);display:block;margin-top:4px}

/* Category page */
.band{background:var(--t);padding-block:36px 26px}
.crumb{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;color:var(--blue);font-weight:800;cursor:pointer}
.band h1{font-size:clamp(30px,4.4vw,54px);font-weight:900;margin-top:12px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:thin}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:22px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800}
.input,select.input,textarea.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--paper);padding:0 14px;font-weight:600;font-size:15px;color:var(--ink)}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical}
.input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(34,176,240,.2)}

/* Product page */
.pp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:start;padding-block:28px 60px}
@media (max-width:960px){.pp{grid-template-columns:1fr}}
.media{position:sticky;top:96px;display:flex;flex-direction:column;gap:12px}
@media (max-width:960px){.media{position:static}}
.modes{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:16px;align-self:flex-start;box-shadow:0 1px 0 var(--line)}
.modes button{border:0;background:none;min-height:42px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.modes button[aria-selected=true]{background:var(--ink);color:#fff}
.viewer{position:relative;height:min(620px,72vh);min-height:420px;border-radius:32px;background:radial-gradient(70% 60% at 50% 35%,#FFFFFF,var(--t));overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:30px 30px 56px}
.viewer .floorshadow{position:absolute;bottom:38px;left:28%;right:28%;height:26px;border-radius:50%;background:rgba(11,42,111,.18);filter:blur(6px)}
.viewer .pedestal{position:absolute;bottom:26px;left:50%;width:min(320px,60%);height:44px;transform:translateX(-50%);border-radius:50%;background:var(--paper);box-shadow:0 10px 0 rgba(11,42,111,.08)}
.viewer img.main{position:relative;z-index:1;max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 24px 26px rgba(11,42,111,.24));transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .3s}
.viewer img.main.rph{filter:drop-shadow(0 18px 22px rgba(11,42,111,.18))}
.viewer.v3dwrap{padding:0;display:block;cursor:grab;background:linear-gradient(180deg,#EAF6FF,#FFF6EA)}
.viewer.v3dwrap:active{cursor:grabbing}
.v3d{position:absolute;inset:0}
.v3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.v3dload{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;font-weight:800;color:var(--ink-2);z-index:2;text-align:center;padding:20px}
.v3dload .sp{width:44px;height:44px;border-radius:50%;border:4px solid rgba(11,42,111,.12);border-top-color:var(--red);animation:spin .9s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lightbox */

/* Footer, sheet, toast */
footer{background:var(--paper);border-top:4px solid transparent;border-image:linear-gradient(90deg,var(--blue),var(--sky),var(--red),var(--orange),var(--gold)) 1;margin-top:40px}

function go(r,opts){
  S.route=r; $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');

}
function render(){
  clearInterval(heroTimer);
  if(V3){try{V3.dispose();}catch(e){} V3=null;} v3tok++;
  document.documentElement.lang=S.lang; document.documentElement.dir=t('dir');
  renderNav(); updateBag();
  const v=$('#view'); const r=S.route; let html='';
  if(r==='home') html=vHome();
  else if(r.startsWith('page:')){const pg=PM.PAGES.find(x=>x.id===r.slice(5)); html=pg?'<section class="band" style="--t:var(--tint-gold)"><div class="wrap">'+crumb([{label:'PLAYMAX',go:'home'},{label:PM.pageTitle(pg,S.lang)}])+'<h1 data-no-translate dir="auto">'+esc(PM.pageTitle(pg,S.lang))+'</h1></div></section><section class="sec" style="padding-top:28px"><div class="wrap">'+PM.pageHtml(pg,S.lang,'data-go="store"')+'</div></section>':vHome();}
  else if(r==='privacy') html='<section class="band" style="--t:var(--tint-sky)"><div class="wrap">'+crumb([{label:'PLAYMAX',go:'home'},{label:'Privacy & terms'}])+'<h1 data-no-translate>'+esc(PM.privacyTitle(S.lang))+'</h1></div></section><section class="sec" style="padding-top:28px"><div class="wrap">'+PM.privacyHtml(S.lang)+'</div></section>';
  else if(r==='store') html=vStore();
  else if(r.startsWith('cat:')) html=vCat(r.slice(4));
  else if(r.startsWith('p:')) html=vProduct(prod(r.slice(2)));
  else if(r==='studio') html=vStudio();
  else if(r==='market') html=vMarket();
  else if(r==='calc') html=vCalc();
  else if(r==='about') html=vAbout();
  else if(r==='maintenance') html=vMaintenance();
  else if(r==='contact') html=vContact();
  else if(r==='cart') html=vCart();
  else if(r==='checkout') html=vCheckout();
  else if(r.startsWith('done:')) html=vDone(r.slice(5));
  else if(r==='account') html=vAccount();
  v.innerHTML='<div class="view-enter">'+html+'</div>';
  after();
  PM.localizeDOM(document.body,S.lang); PM.mk.hydrate(document); document.querySelectorAll('.pm-promo').forEach(w=>PM.carousel(w,5000));
}

    if(act==='open3d'){go('p:'+d.id); S.pview.mode='3d'; render(); return;}
    if(act==='setLang'){S.lang=d.l; $('#langMenu').hidden=true; save(); render(); return;}
    if(act==='pq'){S.pview.qty=Math.max(1,Math.min(99,S.pview.qty+ +d.d)); $('#pQty').textContent=S.pview.qty; return;}
    if(act==='teaserColor'){$$('[data-act=teaserColor]').forEach(b=>b.setAttribute('aria-pressed',b===a)); $('#teaserImg').src=colorSrc(prod(32),+d.i); return;}
    if(act==='spick'){S.studio.pid=+d.id; render(); return;}
    if(act==='scolor'){S.studio.color=+d.i; render(); return;}
    if(act==='addStudio'){addToCart(S.studio.pid,1,S.studio.color,false); return;}
    if(act==='lcolor'){S.cart[+d.l].color=+d.i; save(); render(); return;}
    if(act==='lq'){const l=S.cart[+d.l]; l.qty=Math.max(1,Math.min(99,l.qty+ +d.d)); save(); render(); return;}
    if(act==='lrm'){S.cart.splice(+d.l,1); save(); render(); return;}
    if(act==='inst'){S.installOn=!S.installOn; render(); return;}
    if(act==='heroGo'){if(S.route!=='home'){go('home');} heroShow(+d.i); clearInterval(heroTimer); startHero(); return;}
    if(act==='sendOrder'){const f=$('#orderForm'); if(!f.reportValidity()) return; S.country=$('#oCountry').value; const o=buildOrder(d.via); sendText(orderMessage(o,S.lang),d.via); S.orders.unshift(o); S.cart=[]; save(); go('done:'+o.id); return;}
    if(act==='resend'){const o=S.orders.find(x=>x.id===d.id); if(o) sendText(orderMessage(o,S.lang),d.via); return;}
    if(act==='copyOrder'){const o=S.orders.find(x=>x.id===d.id); if(o) copyText(orderMessage(o,S.lang)).then(()=>toast('Copied')); return;}
    if(act==='sendMsg'){const f=$('#contactForm'); if(!f.reportValidity()) return; const tr=s=>PM.translateText(s,S.lang); const text='✉️ PLAYMAX — '+tr($('#cTopic').value)+'\n\n'+$('#cMsg').value.trim()+'\n\n'+$('#cName').value.trim()+' · '+$('#cContact').value.trim(); sendText(text,d.via); return;}
    if(act==='mkToggle'){S.mkForm=!S.mkForm; S.mkEdit=null; mkPhotos=[]; render(); if(S.mkForm) setTimeout(()=>{const t_=$('#mkTitle'); if(t_){t_.scrollIntoView({block:'center'}); t_.focus();}},50); return;}
    if(act==='mkCancel'){S.mkForm=false; S.mkEdit=null; mkPhotos=[]; render(); return;}
    if(act==='mkEditOpen'){const m=mkPostById(d.a,d.id); if(!m) return; S.mkForm=false; S.mkEdit={author:d.a,id:d.id}; S.mkAsk=null; mkPhotos=(m.photos||[]).map(r=>/^data:/.test(r)?{data:r}:{ref:r}); render(); setTimeout(()=>{const f=$('#mkForm'); if(f) f.scrollIntoView({block:'start',behavior:'smooth'});},50); return;}
    if(act==='mkPhRm'){mkPhotos.splice(+d.i,1); mkDrawPrev(); return;}
    if(act==='mkDelAsk'){S.mkAsk={type:'del',author:d.a,id:d.id}; render(); return;}
    if(act==='mkBanAsk'){S.mkAsk={type:'ban',author:d.a,id:d.id}; render(); return;}
    if(act==='mkAskNo'){S.mkAsk=null; render(); return;}
    if(act==='mkReportAsk'){S.mkAsk={type:'report',author:d.a,id:d.id}; render(); return;}
    if(act==='mkReportSend'){const m=mkPostById(d.a,d.id); a.disabled=true; PM.mk.report(m||{author:d.a,id:d.id},d.r).then(r=>{S.mkAsk=null; render(); toast(r===true?'Thank you. PLAYMAX will review this post.':mkErr(r));}); return;}
    if(act==='mkRepDismiss'){PM.mk.dismissReport(d.rep,d.rid).then(r=>{render(); toast(r===true?'Report dismissed':mkErr(r));}); return;}
    if(act==='mkDelYes'){a.disabled=true; PM.mk.remove(d.a,d.id).then(r=>{S.mkAsk=null; render(); toast(r===true?'Post deleted':mkErr(r));}); return;}
    if(act==='mkBanYes'){a.disabled=true; PM.mk.ban(d.a,true,d.purge==='1').then(r=>{S.mkAsk=null; render(); toast(r===true?(d.purge==='1'?'User blocked and their posts deleted':'User blocked from posting'):mkErr(r));}); return;}
    if(act==='mkUnban'){PM.mk.ban(d.a,false).then(r=>{render(); toast(r===true?'User unblocked':mkErr(r));}); return;}
    if(act==='mkCat'){S.mkCat=d.c; render(); return;}
    if(act==='amode'){S.acctMode=d.m; render(); return;}
    if(act==='guest'){go('home'); toast('Browsing as a guest'); return;}
    if(act==='signOut'){S.user=null; save(); render(); toast('Signed out'); return;}
    if(act==='avis'){const p=prod(d.id); p.visible=!p.visible; save(); a.setAttribute('aria-checked',p.visible); toast(p.model+(p.visible?' is visible in the store':' is hidden from the store')); return;}
    if(act==='copy'){const v=d.v; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied: '+v)).catch(()=>toast(v)); return;}
    if(act==='wClose'){$('#overlay').innerHTML=''; go('home'); toast('Browsing as a guest'); return;}
    if(act==='wReg'){$('#overlay').innerHTML=''; S.acctMode='register'; go('account'); return;}
    if(act==='wLogin'){$('#overlay').innerHTML=''; S.acctMode='login'; go('account'); return;}
    if(act==='lbClose'){$('#overlay').innerHTML=''; return;}
  }
  if(g){ e.preventDefault(); go(g.dataset.go); }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pcard,[role=link]')){e.preventDefault(); go(e.target.dataset.go);} if(e.key==='Enter'&&e.target.id==='viewer'){$('#viewer').click();}});
document.addEventListener('submit',e=>{const f=e.target; const act=f.dataset.act; if(!act) return; e.preventDefault();
  if(act==='mkPost'){const v=id=>$('#'+id).value.trim(); const contacts={phone:v('mkPhone'),whatsapp:v('mkWa'),telegram:v('mkTg'),instagram:v('mkIg'),other:v('mkOther')};
    if(!Object.values(contacts).some(Boolean)){toast('Add at least one way for buyers to contact you.'); $('#mkPhone').focus(); return;}
    if(!mkPhotos.length){toast('Add at least one photo.'); return;}
    const fields={title:v('mkTitle'),cat:v('mkCat'),cond:v('mkCond'),price:+v('mkPrice')||0,country:v('mkCountry'),city:v('mkCity'),desc:v('mkDesc'),seller:v('mkSeller'),contacts};
    const btn=$('#mkSave'); if(btn){btn.disabled=true; btn.textContent='Saving…';}
    const ed=S.mkEdit; const job=ed?PM.mk.edit(ed.author,ed.id,fields,mkPhotos):PM.mk.add(fields,mkPhotos.map(p=>p.data).filter(Boolean));
    job.then(r=>{ if(r===true){S.mkForm=false; S.mkEdit=null; mkPhotos=[]; if(!ed) S.mkCat='all'; render(); toast(ed?'Changes saved':'Your post is published');} else {if(btn){btn.disabled=false; btn.textContent=ed?'Save changes':'Publish post';} toast(mkErr(r));} });
    return; }
  if(act==='register'){const c_=$('#aContact').value.trim(); S.user={name:$('#aName').value.trim(),contact:c_,email:c_.includes('@')?c_:'',phone:c_.includes('@')?'':c_,country:$('#aCountry').value,city:$('#aCity').value.trim()}; S.country=S.user.country; save(); toast('Account created — your details are saved'); go('account');}
  if(act==='login'){const id=$('#lId').value.trim(); S.user={name:'PLAYMAX Customer',contact:id,email:id.includes('@')?id:'',phone:id.includes('@')?'':id,country:S.country,city:''}; save(); toast('Signed in'); go('account');}
  if(act==='acontent'){S.content={headline:$('#acH').value,text:$('#acT').value,annc:null}; save(); renderNav(); toast('Published — the home page now shows your text');}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.matches('[data-act=lnote]')){S.cart[+el.dataset.l].note=el.value; save();}
  if(el.matches('input[type=range][data-k]')){const k=el.dataset.k; S.calc[k]=+el.value; const f={players:v=>v,price:v=>'$'+v,days:v=>v,costs:v=>money(v)}[k]; $('#o-'+k).textContent=f(S.calc[k]); $('#calcRes').innerHTML=calcResult();}
  if(el.matches('[data-act=aprice]')){const p=prod(el.dataset.id); p.price=Math.max(0,+el.value||0); save();}
  if(el.matches('[data-act=arate]')){S.rates[+el.dataset.i].rate=Math.max(0,+el.value||0); save();}
  if(el.matches('[data-act=ainst]')){S.install=Math.max(0,+el.value||0); save();}
});
document.addEventListener('input',e=>{const el=e.target;if(!el.matches('input[type=range][data-k],input[data-calc]'))return;const k=el.dataset.k||el.dataset.calc,val=Number(el.value);if(!Number.isFinite(val))return;S.calc[k]=Math.max(Number(el.min),Math.min(Number(el.max),val));const field=document.querySelector('[data-calc="'+k+'"]'),slider=document.querySelector('input[data-k="'+k+'"]');if(field&&field!==el)field.value=S.calc[k];if(slider&&slider!==el)slider.value=S.calc[k];$('#o-'+k).textContent=k==='price'||k==='costs'?money(S.calc[k]):S.calc[k];$('#calcRes').innerHTML=calcResult();});document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='sortSel'){S.catSort=el.value; render();}
  if(el.id==='pCountry'||el.id==='cartCountry'){S.country=el.value; save(); render();}
  if(el.id==='calcM'){S.calc.pid=+el.value; $('#calcRes').innerHTML=calcResult();}
  if(el.id==='oCountry'){S.country=el.value; save(); $('#coShip').textContent=money(shipFee()); $('#coTotal').textContent=money(orderTotal());}
  if(el.id==='mkFiles'){const files=[...el.files].slice(0,4-mkPhotos.length); Promise.all(files.map(f=>compressImage(f))).then(list=>{mkPhotos=mkPhotos.concat(list.map(data=>({data}))).slice(0,4); mkDrawPrev();}).catch(()=>toast('This photo could not be read.')); el.value='';}
});
$('#menuBtn').addEventListener('click',()=>{const n=$('#nav'); const o=!n.classList.contains('open'); n.classList.toggle('open',o); $('#menuBtn').setAttribute('aria-expanded',o);});

/* ---------- intro ---------- */
function runIntro(force=false){const root=$('#intro-root');window.clearTimeout(window.pmxIntroTimer);root.hidden=false;document.body.style.overflow='hidden';root.innerHTML='<div class="pmx-video-intro" role="dialog" aria-label="PLAYMAX introduction"><iframe title="PLAYMAX animated introduction" src="assets/intro/index.html?embed=1&v=4" allow="autoplay"></iframe><button type="button" class="btn ghost sm" id="skipVideoIntro">Skip</button></div>';const end=()=>{if(root.hidden)return;store.set('web.brandIntroSeen',true);root.hidden=true;root.innerHTML='';document.body.style.overflow='';go('home');};$('#skipVideoIntro').onclick=end;window.pmxIntroTimer=window.setTimeout(end,13500);}
$('#replay').addEventListener('click',()=>runIntro(true));const previewMode=new URLSearchParams(location.search).has('preview');render();if(!previewMode)runIntro();else go('home');
})();
</script>
